<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bramhi Lipi - Mother of Scripts</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(ellipse at 50% 40%, #1a0c00 0%, #0a0400 60%, #000 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Georgia, serif;
}

.scene {
  position: relative;
  width: 500px;
  height: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── AMBIENT GLOW BEHIND CHARACTER ── */
.bg-glow {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,180,30,0.18) 0%, rgba(200,100,0,0.08) 50%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* ── ORBIT PATH (visual ring) ── */
.orbit-ring {
  position: absolute;
  width: 420px;
  height: 160px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,180,30,0.15);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotateX(70deg);
  pointer-events: none;
}

/* ── ORBITING BALL ── */
.orbit-container {
  position: absolute;
  width: 380px;
  height: 380px;
  top: 50%; left: 50%;
  transform: translate(-50%, -52%);
  animation: orbitSpin 3.5s linear infinite;
  pointer-events: none;
  z-index: 10;
}

.orbit-ball {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff5a0, #f5c030 40%, #c87800 80%, #7a4400);
  top: -21px;
  left: 50%;
  transform: translateX(-50%);
  box-shadow:
    0 0 12px 4px rgba(255,200,50,0.7),
    0 0 28px 10px rgba(255,160,0,0.4),
    0 0 55px 20px rgba(200,100,0,0.2);
}

/* tail glow behind ball */
.orbit-ball::after {
  content: '';
  position: absolute;
  width: 60px; height: 12px;
  background: linear-gradient(to left, rgba(255,180,30,0.6), transparent);
  border-radius: 50%;
  top: 50%; right: 100%;
  transform: translateY(-50%);
  filter: blur(3px);
}

@keyframes orbitSpin {
  from { transform: translate(-50%, -52%) rotate(0deg); }
  to   { transform: translate(-50%, -52%) rotate(360deg); }
}

/* ── CHARACTER IMAGE ── */
.character {
  position: relative;
  z-index: 5;
  animation: floatIdle 3s ease-in-out infinite;
  /* Remove any leftover dark fringe with mix-blend-mode */
  mix-blend-mode: normal;
}

.character img {
  width: 380px;
  height: auto;
  /* Lighten/remove any remaining dark halos */
  filter: drop-shadow(0 10px 40px rgba(255,160,30,0.5));
}

@keyframes floatIdle {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-14px); }
}

/* ── SPARKLE PARTICLES ── */
.sparkle {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #f5c842;
  box-shadow: 0 0 6px 3px rgba(245,200,66,0.8);
  animation: sparkleFade var(--dur) ease-in-out infinite var(--delay);
  pointer-events: none;
  z-index: 3;
}
@keyframes sparkleFade {
  0%,100% { opacity:0; transform: scale(0.3) translate(0,0); }
  50%      { opacity:1; transform: scale(1) translate(var(--tx), var(--ty)); }
}

/* ── GROUND SHADOW ── */
.shadow {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px; height: 22px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.55) 0%, transparent 70%);
  animation: shadowPulse 3s ease-in-out infinite;
  z-index: 1;
}
@keyframes shadowPulse {
  0%,100% { transform: translateX(-50%) scaleX(1); opacity: 0.55; }
  50%      { transform: translateX(-50%) scaleX(0.85); opacity: 0.3; }
}

/* ── TITLE ── */
.title {
  position: absolute;
  bottom: -48px;
  width: 100%;
  text-align: center;
  color: #f5c842;
  z-index: 10;
}
.title h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 18px rgba(245,180,30,0.7); }
.title p  { font-size: 0.95rem; color: #c8963e; margin-top: 2px; letter-spacing: 2px; }
</style>
</head>
