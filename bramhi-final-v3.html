<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bramhi Lipi Character</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #FFFBF0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Baloo 2', cursive;
  gap: 0;
}

/* Gentle float — only 8px up/down, slow 3s */
.floater {
  animation: gentleFloat 3s ease-in-out infinite;
  transform-origin: center bottom;
  display: block;
}
@keyframes gentleFloat {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-8px); }
}

/* Shadow shrinks subtly */
.ground-shadow {
  animation: shadowPulse 3s ease-in-out infinite;
  transform-origin: center;
}
@keyframes shadowPulse {
  0%,100% { transform: scaleX(1);    opacity:0.30; }
  50%      { transform: scaleX(0.85); opacity:0.18; }
}

/* ARM — gentle ±10deg, slow 2.5s */
.arm-left-g {
  transform-origin: 230px 198px;   /* shoulder pivot */
  animation: armL 2.5s ease-in-out infinite alternate;
}
@keyframes armL {
  from { transform: rotate(-8deg); }
  to   { transform: rotate(10deg); }
}
.arm-right-g {
  transform-origin: 370px 198px;   /* shoulder pivot */
  animation: armR 2.5s ease-in-out infinite alternate;
  animation-delay: 1.25s;
}
@keyframes armR {
  from { transform: rotate(8deg); }
  to   { transform: rotate(-10deg); }
}

/* LEG — gentle ±8deg, slow 2.8s */
.leg-left-g {
  transform-origin: 268px 355px;
  animation: legL 2.8s ease-in-out infinite alternate;
}
@keyframes legL {
  from { transform: rotate(-6deg); }
  to   { transform: rotate(6deg); }
}
.leg-right-g {
  transform-origin: 332px 355px;
  animation: legR 2.8s ease-in-out infinite alternate;
  animation-delay: 1.4s;
}
@keyframes legR {
  from { transform: rotate(6deg); }
  to   { transform: rotate(-6deg); }
}

/* EYE BLINK — only scaleY on the iris+pupil, not the whole head */
.blink-group {
  transform-origin: 300px 118px;
  animation: eyeBlink 5s ease-in-out infinite;
}
.blink-group2 {
  transform-origin: 300px 118px;
  animation: eyeBlink 5s ease-in-out infinite;
  animation-delay: 0.15s;
}
@keyframes eyeBlink {
  0%,85%,100% { transform: scaleY(1); }
  90%          { transform: scaleY(0.08); }
}

/* Speech bubble */
.bubble {
  background: #fff;
  border: 2.5px solid #C8980A;
  border-radius: 18px;
  padding: 12px 22px;
  margin-bottom: 14px;
  box-shadow: 0 4px 16px rgba(100,50,0,0.13);
  text-align: center;
  max-width: 280px;
  position: relative;
  animation: bubblePop 0.6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes bubblePop {
  from { transform:scale(0.4); opacity:0; }
  to   { transform:scale(1);   opacity:1; }
}
.bubble::after {
  content:''; position:absolute;
  bottom:-13px; left:50%; transform:translateX(-50%);
  border:13px solid transparent;
  border-top-color:#C8980A; border-bottom:none;
}
.bubble::before {
  content:''; position:absolute;
  bottom:-9px; left:50%; transform:translateX(-50%);
  border:10px solid transparent;
  border-top-color:#fff; border-bottom:none; z-index:1;
}
.bt { font-family:'Noto Sans Devanagari',sans-serif; font-size:14px; color:#3A2000; line-height:1.6; }
.be { font-size:11px; color:#C8980A; font-weight:700; letter-spacing:2px; margin-top:4px; }

.char-name    { font-size:24px; font-weight:800; color:#7A5200; margin-top:10px; text-align:center; }
.char-tag     { font-size:11px; color:#DD1111; font-weight:700; letter-spacing:3px; text-transform:uppercase; text-align:center; }
.char-hint    { font-size:11px; color:rgba(120,60,0,0.35); letter-spacing:1px; text-align:center; margin-top:7px; }

/* Sparkle */
.sp { animation: spPop 2.2s ease-in-out infinite; opacity:0; }
@keyframes spPop {
  0%   { opacity:0; transform:scale(0) rotate(0deg);   }
  45%  { opacity:1; transform:scale(1.1) rotate(18deg); }
  100% { opacity:0; transform:scale(0) rotate(45deg);  }
}
</style>
</head>
<body>

<!-- Fixed sparkles -->
<svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;" xmlns="http://www.w3.org/2000/svg">
  <g class="sp" style="animation-delay:0s"   transform="translate(60,130)">  <polygon points="10,0 12,8 20,10 12,12 10,20 8,12 0,10 8,8" fill="#F0D060"/></g>
  <g class="sp" style="animation-delay:0.8s" transform="translate(310,110)"> <polygon points="10,0 12,8 20,10 12,12 10,20 8,12 0,10 8,8" fill="#DD1111"/></g>
  <g class="sp" style="animation-delay:1.6s" transform="translate(55,370)">  <polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6"   fill="#F0D060"/></g>
  <g class="sp" style="animation-delay:2.4s" transform="translate(305,360)"> <polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6"   fill="#DD1111"/></g>
</svg>

<!-- Speech bubble -->
<div class="bubble">
  <div class="bt">नमस्ते! मैं ब्राह्मी हूँ 🙏<br>लिपियों की जननी!</div>
  <div class="be">MOTHER OF ALL SCRIPTS</div>
</div>

<!--
  ╔══════════════════════════════════════════╗
  ║   BRAMHI LIPI CHARACTER — FINAL v3      ║
  ║   viewBox 600×520 (plenty of space)     ║
  ║   Face sits ON TOP of hex, proper size  ║
  ║   Arms attached at hex sides (smooth)   ║
  ║   Legs below hex (smooth rounded)       ║
  ╚══════════════════════════════════════════╝
  COORDINATE MAP:
    Face circle  : cx=300 cy=95  r=62
    Hex body     : top=152  bottom=400  left=168  right=432
    Shoulders    : y=198  left-x=190  right-x=410
    Hip base     : y=390
    Legs start   : y=390
-->
<svg class="floater" id="charSVG"
     width="320" height="430"
     viewBox="80 30 440 480"
     xmlns="http://www.w3.org/2000/svg"
     style="cursor:pointer; overflow:visible;">

  <defs>
    <!-- Hex gold -->
    <linearGradient id="gHex" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#EDD870"/>
      <stop offset="28%"  stop-color="#D4B84A"/>
      <stop offset="62%"  stop-color="#B89025"/>
      <stop offset="100%" stop-color="#896510"/>
    </linearGradient>
    <!-- Limb / face skin -->
    <linearGradient id="gSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F2CD78"/>
      <stop offset="100%" stop-color="#D4A040"/>
    </linearGradient>
    <!-- Shoe -->
    <linearGradient id="gShoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C8980A"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <!-- Eye white -->
    <radialGradient id="gEW" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#F0E4C0"/>
    </radialGradient>
    <!-- Drop shadow filter -->
    <filter id="fDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="rgba(80,40,0,0.28)"/>
    </filter>
    <filter id="fSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="rgba(80,40,0,0.22)"/>
    </filter>
  </defs>

  <!-- ══════════ LEFT ARM ══════════
       Shoulder at (190, 198)
       Single smooth rounded pill — no visible joint
  -->
  <g class="arm-left-g" filter="url(#fSm)">
    <!-- Full arm as one smooth elongated capsule -->
    <rect x="142" y="190" width="50" height="110" rx="25" fill="url(#gSkin)"/>
    <!-- Hand — smooth circle, blends into arm -->
    <circle cx="167" cy="310" r="26" fill="url(#gSkin)"/>
    <!-- Knuckle hint — very subtle -->
    <path d="M153,304 Q167,298 181,304" stroke="#C8980A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Thumb -->
    <ellipse cx="142" cy="302" rx="12" ry="18" rx2="12" fill="url(#gSkin)" transform="rotate(-15,142,302)"/>
  </g>

  <!-- ══════════ RIGHT ARM ══════════ -->
  <g class="arm-right-g" filter="url(#fSm)">
    <rect x="408" y="190" width="50" height="110" rx="25" fill="url(#gSkin)"/>
    <circle cx="433" cy="310" r="26" fill="url(#gSkin)"/>
    <path d="M419,304 Q433,298 447,304" stroke="#C8980A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="458" cy="302" rx="12" ry="18" fill="url(#gSkin)" transform="rotate(15,458,302)"/>
  </g>

  <!-- ══════════ LEFT LEG ══════════
       Hip at (268, 390) — single smooth pill + shoe
  -->
  <g class="leg-left-g" filter="url(#fSm)">
    <!-- Full leg — one smooth capsule -->
    <rect x="244" y="385" width="48" height="110" rx="24" fill="url(#gSkin)"/>
    <!-- Shoe — rounded, organic shape -->
    <ellipse cx="268" cy="500" rx="36" ry="16" fill="url(#gShoe)"/>
    <ellipse cx="265" cy="495" rx="26" ry="10" fill="#D4A030"/>
    <!-- Shoe shine -->
    <ellipse cx="256" cy="490" rx="11" ry="5" fill="#FFE070" opacity="0.30"/>
  </g>

  <!-- ══════════ RIGHT LEG ══════════ -->
  <g class="leg-right-g" filter="url(#fSm)">
    <rect x="308" y="385" width="48" height="110" rx="24" fill="url(#gSkin)"/>
    <ellipse cx="332" cy="500" rx="36" ry="16" fill="url(#gShoe)"/>
    <ellipse cx="329" cy="495" rx="26" ry="10" fill="#D4A030"/>
    <ellipse cx="320" cy="490" rx="11" ry="5" fill="#FFE070" opacity="0.30"/>
  </g>

  <!-- ══════════ NECK ══════════ -->
  <rect x="278" y="150" width="44" height="28" rx="14" fill="url(#gSkin)"/>

  <!-- ══════════ FACE ══════════
       cx=300 cy=95 r=62
       Face is large, clean, well above hex
  -->
  <circle cx="300" cy="95" r="62" fill="url(#gSkin)" filter="url(#fSm)"/>

  <!-- Cheek blush -->
  <ellipse cx="258" cy="108" rx="16" ry="10" fill="#E06030" opacity="0.18"/>
  <ellipse cx="342" cy="108" rx="16" ry="10" fill="#E06030" opacity="0.18"/>

  <!-- Eyebrows — gentle arches -->
  <path d="M268,74 Q283,65 296,72" stroke="#7A3A00" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M304,72 Q317,65 332,74" stroke="#7A3A00" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- ── LEFT EYE (blink = scaleY on iris only) ── -->
  <!-- White sclera — stays always -->
  <ellipse cx="283" cy="92" rx="16" ry="17" fill="url(#gEW)"/>
  <!-- Iris + pupil group — this blinks -->
  <g class="blink-group" style="transform-origin:283px 92px;">
    <ellipse cx="283" cy="94" rx="10" ry="11" fill="#8B1A00"/>
    <circle  cx="283" cy="94" r="6.5" fill="#1A0600"/>
    <circle  cx="287" cy="89" r="3"   fill="white" opacity="0.88"/>
  </g>
  <!-- Top lash -->
  <path d="M268,82 Q283,74 298,81" stroke="#5A2000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ── RIGHT EYE ── -->
  <ellipse cx="317" cy="92" rx="16" ry="17" fill="url(#gEW)"/>
  <g class="blink-group2" style="transform-origin:317px 92px;">
    <ellipse cx="317" cy="94" rx="10" ry="11" fill="#8B1A00"/>
    <circle  cx="317" cy="94" r="6.5" fill="#1A0600"/>
    <circle  cx="321" cy="89" r="3"   fill="white" opacity="0.88"/>
  </g>
  <path d="M302,81 Q317,74 332,82" stroke="#5A2000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M294,108 Q300,114 306,108" stroke="#C89030" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Smile — gentle curve -->
  <path d="M283,120 Q300,132 317,120" stroke="#A05010" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════════════
       HEXAGON BODY  —  BRAMHI LIPI LOGO
       Exact gold hex + red Brahmi script
       Hex: center=300, top=152, bottom=400
  ═══════════════════════════════════════════ -->
  <g filter="url(#fDrop)">

    <!-- Hexagon -->
    <path d="M300,152  L420,220  L420,388  L300,456  L180,388  L180,220  Z"
          fill="url(#gHex)"
          stroke="#C8980A" stroke-width="4"/>

    <!-- Inner bevel -->
    <path d="M300,162  L412,226  L412,382  L300,448  L188,382  L188,226  Z"
          fill="none" stroke="rgba(255,240,100,0.25)" stroke-width="2"/>

    <!-- ══════════════════════════════
         BRAMHI SCRIPT — RED
         Two rows exactly like logo
    ══════════════════════════════ -->

    <!-- ROW 1 LEFT: Big rectangular frame -->
    <rect x="196" y="218" width="84" height="66" rx="4"
          fill="none" stroke="#DD1111" stroke-width="8"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Wavy vertical inside rect (right edge detail) -->
    <path d="M268,224 Q261,237 268,252 Q275,267 268,280"
          stroke="#DD1111" stroke-width="7" fill="none"
          stroke-linecap="round"/>

    <!-- ROW 1 RIGHT TOP: tall char with top-right curl -->
    <line x1="302" y1="220" x2="302" y2="256"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <line x1="302" y1="238" x2="328" y2="238"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <line x1="328" y1="220" x2="328" y2="252"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <!-- Curl -->
    <path d="M328,220 C342,208 354,214 354,226 C354,236 344,242 328,238"
          stroke="#DD1111" stroke-width="7" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ROW 1 RIGHT BOTTOM: stem + circle -->
    <line x1="314" y1="252" x2="314" y2="284"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <circle cx="336" cy="270" r="16"
            fill="none" stroke="#DD1111" stroke-width="7"/>

    <!-- ROW 2 LEFT: two pillars + crossbar + left foot curl -->
    <line x1="210" y1="300" x2="210" y2="346"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <line x1="238" y1="300" x2="238" y2="346"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <line x1="210" y1="314" x2="244" y2="314"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <line x1="238" y1="300" x2="256" y2="300"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <!-- Left foot curl -->
    <path d="M210,346 C202,360 190,358 190,344 C190,332 200,328 210,334"
          stroke="#DD1111" stroke-width="7" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ROW 2 RIGHT: single pillar + top serif + omega foot -->
    <line x1="278" y1="300" x2="278" y2="350"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <line x1="278" y1="300" x2="302" y2="300"
          stroke="#DD1111" stroke-width="8" stroke-linecap="round"/>
    <!-- Omega/curved foot -->
    <path d="M278,350 C278,366 292,370 300,360 C308,350 304,338 294,336"
          stroke="#DD1111" stroke-width="7" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- Ground shadow -->
  <ellipse class="ground-shadow" cx="300" cy="510" rx="90" ry="12"
           fill="rgba(100,50,0,0.28)"/>

</svg>

<!-- Label -->
<div class="char-name">ब्राह्मी</div>
<div class="char-tag">Bramhi Lipi · Mother of Scripts</div>
<div class="char-hint">👆 Click करें</div>

<script>
const svg = document.getElementById('charSVG');
const fl  = svg;  // the svg itself is the floater

svg.addEventListener('click', () => {
  fl.style.animation = 'none';
  fl.getBoundingClientRect();
  fl.style.animation = 'jumpOnce 0.6s cubic-bezier(.36,.07,.19,.97) forwards';
  setTimeout(() => {
    fl.style.animation = 'gentleFloat 3s ease-in-out infinite';
  }, 620);
});
</script>

<style>
@keyframes jumpOnce {
  0%   { transform: translateY(0)    scale(1, 1);       }
  30%  { transform: translateY(-36px) scale(0.95,1.05);  }
  58%  { transform: translateY(-44px) scale(0.93,1.07);  }
  80%  { transform: translateY(-6px)  scale(1.03,0.97);  }
  100% { transform: translateY(0)    scale(1, 1);       }
}
</style>

</body>
</html>
